name: camera-ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/camera-edge
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.9.28"
      - name: Verify lock
        run: uv sync --project . --frozen --extra dev
      - name: Ruff check
        run: uv run --project . ruff check .
      - name: Ruff format check
        run: uv run --project . ruff format --check .
      - name: Pytest
        run: uv run --project . pytest
      - name: Container build
        run: docker buildx build --platform linux/arm64 --load -t camera-edge:ci .
